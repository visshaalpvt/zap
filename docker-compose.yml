services:
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: zap-scanner
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.key=${ZAP_API_KEY:-changeme123} -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./reports:/zap/wrk:rw
